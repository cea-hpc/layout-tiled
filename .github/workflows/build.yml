name: CI

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CMAKE_GENERATOR: "Ninja Multi-Config"
  CMAKE_COLOR_DIAGNOSTICS: ON
  CMAKE_EXPORT_COMPILE_COMMANDS: ON

on:
  pull_request:
    branches: [ "main" ]

jobs:
  # Detect changes to only run the relevant jobs
  changes:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      core: ${{ steps.filter.outputs.core }}
      tests: ${{ steps.filter.outputs.tests }}
      examples: ${{ steps.filter.outputs.examples }}
      benchmarks: ${{ steps.filter.outputs.benchmarks }}
    steps:
    - uses: dorny/paths-filter@v3
      id: filter
      with:
        filters: |
          core:
            - 'include/layout_tiled/**'
          tests:
            - 'tests/layout_tiled/**'
          examples:
            - 'examples/**'
          benchmarks:
            - 'benchmarks/**'

  build-tests:
    needs: changes
    if: ${{ needs.changes.outputs.core == 'true' || needs.changes.outputs.tests == 'true' }}
    strategy:
      fail-fast: false
      matrix:
        compiler: [ {cpp: clang++, build_dir: llvm }, {cpp: g++, build_dir: gcc} ]
        build_type: [Debug, Release]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Get CMake & Ninja
        uses: lukka/get-cmake@latest
        with:
          cmakeVersion: "~3.25.0"
          ninjaVersion: "^1.12.1"

      - name: Configure
        run: >
          cmake
          -B build/${{ matrix.compiler.build_dir }}
          -DCMAKE_CXX_COMPILER=${{ matrix.compiler.cpp }}
          -DLAYOUT_TILED_BUILD_TESTS=ON
      - name: Build
        run: cmake --build build/${{ matrix.compiler.build_dir }} --config ${{ matrix.build_type }} --verbose
      - name: Run tests
        run: ctest --test-dir build/${{ matrix.compiler.build_dir }} --build-config ${{ matrix.build_type }} --verbose

  build-examples:
    needs: changes
    if: ${{ needs.changes.outputs.core == 'true' || needs.changes.outputs.examples == 'true' }}
    strategy:
      fail-fast: false
      matrix:
        compiler: [ {cpp: clang++, build_dir: llvm }, {cpp: g++, build_dir: gcc} ]
        build_type: [Debug, Release]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Get CMake & Ninja
        uses: lukka/get-cmake@latest
        with:
          cmakeVersion: "~3.25.0"
          ninjaVersion: "^1.12.1"

      - name: Configure
        run: >
          cmake
          -B build/${{ matrix.compiler.build_dir }}
          -DCMAKE_CXX_COMPILER=${{ matrix.compiler.cpp }}
          -DLAYOUT_TILED_BUILD_EXAMPLES=ON
      - name: Build
        run: cmake --build build/${{ matrix.compiler.build_dir }} --config ${{ matrix.build_type }} --verbose

  build-benchmarks:
    needs: changes
    if: ${{ needs.changes.outputs.core == 'true' || needs.changes.outputs.benchmarks == 'true' }}
    strategy:
      fail-fast: false
      matrix:
        compiler: [ {cpp: clang++, build_dir: llvm }, {cpp: g++, build_dir: gcc} ]
        benchmark: [{ name: gemm, args: "-n 256" }, { name: stencil_2d, args: "-n 512"}, { name: stencil_3d, args: "-n 64" }]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Get CMake & Ninja
        uses: lukka/get-cmake@latest
        with:
          cmakeVersion: "~3.25.0"
          ninjaVersion: "^1.12.1"
      - name: Get OpenBLAS and OpenMP
        run: sudo apt update && sudo apt install libopenblas-dev libomp-dev

      - name: Configure sequential
        run: >
          cmake
          -B build/seq-${{ matrix.compiler.build_dir }}
          -DCMAKE_CXX_COMPILER=${{ matrix.compiler.cpp }}
          -DLAYOUT_TILED_BUILD_BENCHMARKS=ON
          -DLAYOUT_TILED_BENCH_ENABLE_BLAS=ON
      - name: Build sequential
        run: cmake --build build/seq-${{ matrix.compiler.build_dir }} --config Release --verbose --target layout_tiled.benchmarks.${{ matrix.benchmark.name }}
      - name: Run sequential
        run: ./build/seq-${{ matrix.compiler.build_dir }}/benchmarks/Release/layout_tiled.benchmarks.${{ matrix.benchmark.name }} ${{ matrix.benchmark.args }}

      - name: Configure parallel
        run: >
          cmake
          -B build/par-${{ matrix.compiler.build_dir }}
          -DCMAKE_CXX_COMPILER=${{ matrix.compiler.cpp }}
          -DLAYOUT_TILED_BUILD_BENCHMARKS=ON
          -DLAYOUT_TILED_BENCH_ENABLE_BLAS=ON
          -DLAYOUT_TILED_BENCH_ENABLE_OMP=ON
      - name: Build parallel
        run: cmake --build build/par-${{ matrix.compiler.build_dir }} --config Release --verbose --target layout_tiled.benchmarks.${{ matrix.benchmark.name }}
      - name: Run parallel
        run: ./build/par-${{ matrix.compiler.build_dir }}/benchmarks/Release/layout_tiled.benchmarks.${{ matrix.benchmark.name }} ${{ matrix.benchmark.args }}

  install:
    needs: changes
    if: ${{ needs.changes.outputs.core == 'true' }}
    strategy:
      fail-fast: false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Get CMake & Ninja
        uses: lukka/get-cmake@latest
        with:
          cmakeVersion: "~3.25.0"
          ninjaVersion: "^1.12.1"

      - name: Configure
        run: cmake -B build
      - name: Build
        run: |
          cmake --install build --prefix /opt/layout_tiled
          find /opt/layout_tiled -type f
