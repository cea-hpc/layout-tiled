name: CI

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CXX: clang++
  CMAKE_GENERATOR: "Ninja Multi-Config"
  CMAKE_COLOR_DIAGNOSTICS: ON

jobs:
  # Detect changes to only run the relevant jobs
  changes:
    runs-on: ubuntu-24.04
    outputs:
      core: ${{ steps.filter.outputs.core }}
      tests: ${{ steps.filter.outputs.tests }}
      examples: ${{ steps.filter.outputs.examples }}
      benchmarks: ${{ steps.filter.outputs.benchmarks }}
    steps:
    - uses: actions/checkout@v4

    - uses: dorny/paths-filter@v3
      id: filter
      with:
        filters: |
          core:
            - 'include/layout_tiled/**'
          tests:
            - 'tests/layout_tiled/**'
          examples:
            - 'examples/**'
          benchmarks:
            - 'benchmarks/**'

  build-tests:
    needs: changes
    if: ${{ needs.changes.outputs.core == 'true' || needs.changes.outputs.tests == 'true' }}
    strategy:
      fail-fast: false
      matrix:
        build_type: [Debug, Release]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Get CMake & Ninja
        uses: lukka/get-cmake@latest
        with:
          cmakeVersion: "~3.25.0"
          ninjaVersion: "^1.12.1"

      - name: Get LLVM libc++
        run: sudo apt update && sudo apt install libc++-dev

      - name: Configure
        run: cmake -S . -B build -DLayoutTiled_BUILD_TESTS=ON

      - name: Build
        run: cmake --build build --config ${{ matrix.build_type }} --verbose

      - name: Run tests
        run: ctest --test-dir build --build-config ${{ matrix.build_type }} --verbose

  build-examples:
    needs: changes
    if: ${{ needs.changes.outputs.core == 'true' || needs.changes.outputs.examples == 'true' }}
    strategy:
      fail-fast: false
      matrix:
        build_type: [Debug, Release]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Get CMake & Ninja
        uses: lukka/get-cmake@latest
        with:
          cmakeVersion: "~3.25.0"
          ninjaVersion: "^1.12.1"

      - name: Get LLVM libc++
        run: sudo apt update && sudo apt install libc++-dev

      - name: Configure
        run: cmake -S . -B build -DLayoutTiled_BUILD_EXAMPLES=ON

      - name: Build
        run: cmake --build build --config ${{ matrix.build_type }} --verbose

  build-benchmarks:
    needs: changes
    if: ${{ needs.changes.outputs.core == 'true' || needs.changes.outputs.benchmarks == 'true' }}
    strategy:
      fail-fast: false
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Get CMake & Ninja
        uses: lukka/get-cmake@latest
        with:
          cmakeVersion: "~3.25.0"
          ninjaVersion: "^1.12.1"

      - name: Get LLVM libc++ and OpenMP
        run: sudo apt update && sudo apt install libc++-dev libomp-dev

      - name: Configure
        run: cmake -S . -B build -DLayoutTiled_BUILD_BENCHMARKS=ON -DLayoutTiled_PARALLEL_BENCH=ON

      - name: Build
        run: cmake --build build --config Release --verbose

  install:
    needs: changes
    if: ${{ needs.changes.outputs.core == 'true' }}
    strategy:
      fail-fast: false
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Get CMake & Ninja
        uses: lukka/get-cmake@latest
        with:
          cmakeVersion: "~3.25.0"
          ninjaVersion: "^1.12.1"

      - name: Get LLVM libc++
        run: sudo apt update && sudo apt install libc++-dev

      - name: Configure
        run: cmake -S . -B build

      - name: Build
        run: |
          cmake --install build --prefix /opt/layout_tiled
          find /opt/layout_tiled -type f
