name: CI

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CMAKE_COLOR_DIAGNOSTICS: ON

on:
  pull_request:
    branches: [ "main" ]

jobs:
  # Detect changes to only run the relevant jobs
  changes:
    runs-on: ubuntu-24.04
    permissions:
      pull-requests: read
    outputs:
      core: ${{ steps.filter.outputs.core }}
      tests: ${{ steps.filter.outputs.tests }}
      examples: ${{ steps.filter.outputs.examples }}
      benchmarks: ${{ steps.filter.outputs.benchmarks }}
    steps:
    - uses: dorny/paths-filter@v3
      id: filter
      with:
        filters: |
          core:
            - 'include/layout_tiled/**'
          tests:
            - 'tests/layout_tiled/**'
          examples:
            - 'examples/**'
          benchmarks:
            - 'benchmarks/**'

  build-and-test:
    needs: changes
    if: ${{ needs.changes.outputs.core == 'true' || needs.changes.outputs.tests == 'true' }}
    strategy:
      fail-fast: false
      matrix:
        workflow_type: [gcc-debug, gcc-release, llvm-debug, llvm-release]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Get CMake & Ninja
        uses: lukka/get-cmake@latest
        with:
          cmakeVersion: "~3.25.0"
          ninjaVersion: "^1.12.1"

      - name: Install BLAS
        run: apt install -y libopenblas-dev

      - name: Configure, build and run tests
        run: cmake --workflow --preset ${{ matrix.workflow_type }}

  build-examples:
    needs: changes
    if: ${{ needs.changes.outputs.core == 'true' || needs.changes.outputs.examples == 'true' }}
    strategy:
      fail-fast: false
      matrix:
        workflow_type: [gcc-debug, gcc-release, llvm-debug, llvm-release]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Get CMake & Ninja
        uses: lukka/get-cmake@latest
        with:
          cmakeVersion: "~3.25.0"
          ninjaVersion: "^1.12.1"

      - name: Install BLAS
        run: apt install -y libopenblas-dev

      - name: Configure and build examples
        run: cmake --workflow --preset ${{ matrix.workflow_type }}

  build-benchmarks:
    needs: changes
    if: ${{ needs.changes.outputs.core == 'true' || needs.changes.outputs.benchmarks == 'true' }}
    strategy:
      fail-fast: false
      matrix:
        workflow_type: [gcc-debug, gcc-release, llvm-debug, llvm-release]
        benchmark: [gemm -n256, stencil_2d -n256, stencil_3d -n64]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Get CMake & Ninja
        uses: lukka/get-cmake@latest
        with:
          cmakeVersion: "~3.25.0"
          ninjaVersion: "^1.12.1"

      - name: Install BLAS
        run: apt install -y libopenblas-dev

      - name: Configure and build sequential benchmarks
        run: cmake --workflow --preset ${{ matrix.workflow_type }}
      - name: Run sequential benchmarks
        run: build/${{ matrix.workflow_type }} ${{ matrix.benchmark }}

      - name: Clean sequential benchmarks
        run: rm --recursive --force build/${{ matrix.workflow_type }}

      - name: Configure and build parallel benchmarks
        run: cmake --workflow --preset ${{ matrix.workflow_type }}
      - name: Run parallel benchmarks
        run: build/${{ matrix.workflow_type }} ${{ matrix.benchmark }}

  install:
    needs: changes
    if: ${{ needs.changes.outputs.core == 'true' }}
    strategy:
      fail-fast: false
      matrix:
        workflow_type: [gcc-debug, gcc-release, llvm-debug, llvm-release]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Get CMake & Ninja
        uses: lukka/get-cmake@latest
        with:
          cmakeVersion: "~3.25.0"
          ninjaVersion: "^1.12.1"

      - name: Install BLAS
        run: apt install -y libopenblas-dev

      - name: Configure and build
        run: |
          cmake --preset ${{ matrix.workflow_type }}
          cmake --build --preset ${{ matrix.workflow_type }}

      - name: Install
        run: |
          cmake --install build/${{ matrix.workflow_type }} --prefix /opt/layout_tiled
          find /opt/layout_tiled -type f
